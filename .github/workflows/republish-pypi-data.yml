name: Republish PyPI data

# Manual helper: (re)upload the per-language PyPI data packages for the version
# currently in Cargo.toml. It is idempotent — publish-pypi-data.sh uploads one
# wheel at a time, skips files already on the index and retries transient
# errors — so it can resume an interrupted release. Used to finish 0.1.1 after
# PyPI returned HTTP 429 partway through the upload.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pypi-data:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish the per-language PyPI data packages
        run: scripts/release/publish-pypi-data.sh
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
