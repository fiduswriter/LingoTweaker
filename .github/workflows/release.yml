name: Release

# Tag-driven prerelease publishing to crates.io, PyPI and npm.
#
# Pushing a tag like `v0.1.0-alpha.1` (which must match the workspace version)
# publishes the prerelease. This workflow is intentionally separate from
# ci.yml and does not touch the `parity` or `test` jobs.
#
# Secrets: CARGO_REGISTRY_TOKEN (crates.io) and PYPI_API_TOKEN (the
# `lingotweaker` wheel). npm uses trusted publishing (OIDC) for
# `lingotweaker`, `lingotweaker-wasm`, `lingotweaker-data` and every
# `lingotweaker-data-<lang>` data package (configured on npmjs.com: owner
# `fiduswriter`, repo `LingoTweaker`, workflow `release.yml`),
# which only needs `id-token: write`. The `data` job uses the workflow token
# with `contents: write` to attach assets to the GitHub Release.
#
# The per-language PyPI data distributions are NOT published here: they have
# their own version (data/pypi-version) and are only republished when data/
# actually changes, via the manual `publish-pypi-data` workflow. Publishing
# them on every engine release would re-upload identical wheels and retrip
# PyPI's new-project rate limit.
#
# Forgejo reads .github/workflows too, but publishing happens only from the
# GitHub mirror (secrets, npm/PyPI trusted publishing and GitHub Release
# assets are GitHub-only). Every job is gated to GitHub so a tag pushed to
# Forgejo neither fails nor half-publishes.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Validate the tag against the workspace version and derive the PEP 440
  # version so every registry gets the same release.
  version:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    outputs:
      cargo: ${{ steps.v.outputs.cargo }}
      python: ${{ steps.v.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$manifest" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${manifest}" >&2
            exit 1
          fi
          py="$(python3 -c "import sys; v='${tag}'; core,_,pre=v.partition('-'); print(core+'a'+pre.split('.')[1] if pre.startswith('alpha.') else v)")"
          echo "cargo=${tag}" >> "$GITHUB_OUTPUT"
          echo "python=${py}" >> "$GITHUB_OUTPUT"

  # Per-language runtime data attached to the GitHub Release: gzipped packs,
  # extractable native archives and a sha256 manifest.
  data:
    needs: version
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build and attach release data assets
        run: scripts/release/publish-data.sh "v${{ needs.version.outputs.cargo }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # The code-only npm data loader and one data package per language, shared by
  # both engine packages (a single multi-language tarball exceeds npm's E413
  # request limit).
  npm-data:
    needs: version
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build and publish lingotweaker-data + lingotweaker-data-<lang>
        run: scripts/release/publish-npm-data.sh

  crates:
    needs: version
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Publish lt-* crates and the lingotweaker facade
        run: scripts/release/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Verify from crates.io
        run: scripts/release/verify-crates.sh "${{ needs.version.outputs.cargo }}"

  pypi:
    needs: version
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/lt-py/Cargo.toml --out dist
          manylinux: auto
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path crates/lt-py/Cargo.toml --out dist
      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/lingotweaker-*.whl
          LT_DATA_DIR="$PWD/data" /tmp/smoke/bin/python crates/lt-py/tests/python/test_smoke.py
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Re-runs of a moved tag hit "File already exists" for the wheels
          # the first run uploaded; that is not a failure.
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    needs: [version, npm-data]
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build, smoke-test and publish the addon
        run: scripts/release/publish-npm.sh

  wasm:
    needs: [version, npm-data]
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build, smoke-test and publish lingotweaker-wasm
        run: scripts/release/publish-wasm.sh