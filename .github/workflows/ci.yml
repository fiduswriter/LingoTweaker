name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub and Forgejo runners differ: GitHub's ubuntu-latest ships a Rust
      # toolchain, Forgejo's image does not. Bootstrap rustup if absent, then
      # install the pinned toolchain (rust-toolchain.toml). rustup reads the
      # components (rustfmt/clippy) from that file.
      - name: Install Rust
        run: |
          command -v rustup >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          command -v rustup >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      # rust-cache needs GitHub's cache service; the Forgejo runner has none
      # (the cache request times out), so only cache on GitHub.
      - if: github.server_url == 'https://github.com'
        uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The publish-only `lingotweaker` facade lives in its own workspace (excluded
  # from the root) and compiles the same engine source through a symlink, so it
  # needs its own dependency list. A dependency added to `crates/lt` but not to
  # the facade manifest made `cargo publish lingotweaker` fail to build (found
  # while preparing 0.1.0), so build it here too.
  facade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          command -v rustup >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - if: github.server_url == 'https://github.com'
        uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path crates/lingotweaker/Cargo.toml

  # The per-language PyPI data versions in data/pypi-versions.json are bumped
  # from a content hash; fail when data/ changed without re-running
  # scripts/release/update-pypi-data-versions.py (which updates the file).
  pypi-data-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release/update-pypi-data-versions.py --check

  # Heavy jobs (test/bindings/wasm/parity) run on the GitHub mirror only: its
  # runners have a warm cache and enough disk. The Forgejo runner has neither
  # (workspace builds die with "No space left on device"), while the light
  # jobs below (fmt/clippy/python-tools/affected) run on both hosts.
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      # the German tests build ~1 GB engines serially; without a single
      # malloc arena glibc keeps ~700 MB per thread arena alive, pushing the
      # peak to >20 GB (D-033)
      MALLOC_ARENA_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          command -v rustup >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      # rust-cache needs GitHub's cache service; the Forgejo runner has none
      # (the cache request times out), so only cache on GitHub.
      - if: github.server_url == 'https://github.com'
        uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Pure-Python dictionary tooling (tools/morfologik): self-contained, no JVM.
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/morfologik/tests
      - run: python3 scripts/ci/check-demo-languages.py

  # P6.3: the parity matrix is computed from the changed paths (owner
  # gate-scope rule: a change gates only the languages it can influence;
  # shared paths -> all). `affected` runs
  # scripts/ci/affected-languages.sh and exports the JSON list. GitHub
  # rejects an empty matrix, so an empty list (docs-only changes) becomes the
  # sentinel ["none"] and every parity step below is guarded by
  # `matrix.lang != 'none'`; the job-level `if` additionally skips the job.
  affected:
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.compute.outputs.langs }}
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: compute
        env:
          # push: the previous head (all-zero on branch creation);
          # pull_request: the PR base commit
          AFFECTED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFFECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          langs="$(scripts/ci/affected-languages.sh)"
          if [ "$langs" = "[]" ]; then
            matrix='["none"]'
          else
            matrix="$langs"
          fi
          echo "langs=$langs" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "parity matrix: $matrix"

  # Per-language corpus parity vs the pinned Java CheckDump goldens
  # (docs/parity/golden, no Docker needed; scripts/ci/parity.sh). de/es/it/nl
  # must be 0 only-Java / 0 only-Rust / 0 field diffs; en carries exactly the
  # one documented deliberate field diff; fr carries the documented
  # divergences #3/#4/#5 and pt #6 (validated exactly by
  # --expect-only-java/--expect-field-diffs). no/nrd/gn have no Java oracle
  # and run the parity.sh tests-only gate (integration test + inventory).
  # The matrix is the affected language set (P6.3/D-134), not a static list.
  parity:
    needs: affected
    if: needs.affected.result == 'success' && needs.affected.outputs.langs != '[]' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.affected.outputs.matrix) }}
    steps:
      - if: matrix.lang != 'none'
        uses: actions/checkout@v4
      - if: matrix.lang != 'none'
        name: Install Rust
        run: |
          command -v rustup >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - if: matrix.lang != 'none' && github.server_url == 'https://github.com'
        uses: Swatinem/rust-cache@v2
      - if: matrix.lang != 'none'
        run: cargo build --release -p lt-cli
      - if: matrix.lang != 'none'
        run: scripts/ci/parity.sh ${{ matrix.lang }}

  # P2.4: PyO3/napi-rs bindings — build the extension modules and run the
  # Python/Node smoke, thread-safety and (when granian is available) ASGI
  # integration tests.
  bindings:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          command -v rustup >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      # Both hosts already ship python3 and node (GitHub's ubuntu-latest and
      # the Forgejo runner image). actions/setup-python/setup-node cannot
      # provision their cached versions on Forgejo, so use the runner tools
      # and a venv for granian (the ASGI smoke skips itself without granian).
      - name: Set up Python venv + granian
        run: |
          python3 -m venv /tmp/lt-venv
          /tmp/lt-venv/bin/pip install --upgrade pip
          /tmp/lt-venv/bin/pip install granian
          echo "/tmp/lt-venv/bin" >> "$GITHUB_PATH"
      - run: scripts/bindings/smoke.sh

  # wasm: build the browser bindings, package one small language and exercise
  # the actual wasm module from Node (engine built from an in-memory data
  # pack; no file system in the module).
  wasm:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          command -v rustup >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      # rust-cache needs GitHub's cache service; the Forgejo runner has none
      # (the cache request times out), so only cache on GitHub.
      - if: github.server_url == 'https://github.com'
        uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - run: cargo run --release -p lt-data --bin pack_data -- data gn /tmp/lt-gn.pack
      - run: wasm-pack build crates/lt-wasm --target nodejs --out-dir ../../target/wasm-pkg/node
      - run: node tools/wasm/smoke.mjs /tmp/lt-gn.pack

  # P0.4 drift job: scheduled upstream delta report (advisory until P5.4).
  upstream-drift:
    if: github.event_name == 'schedule' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Classify upstream changes
        run: |
          git clone --depth 1 https://github.com/languagetool-org/languagetool /tmp/lt-upstream
          python3 tools/lt-sync/lt_sync.py status --upstream /tmp/lt-upstream
      - name: Upload delta report
        uses: actions/upload-artifact@v4
        with:
          name: lt-sync-status
          path: docs/parity/lt-sync-status.json
