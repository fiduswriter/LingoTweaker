name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub Pages is GitHub-only; the Forgejo runner reads .github/workflows
  # too, so skip the whole job there (Forgejo's github.server_url is its own
  # host, GitHub's is https://github.com). The deploy job then skips as well.
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      # build the split packs (en-lite base + models/variant sidecars); the
      # worker falls back to the full packs when the split is absent
      SPLIT_PACKS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Build wasm bindings
        run: wasm-pack build crates/lt-wasm --target web --out-dir ../../demo/pkg

      - name: Build data packs
        run: bash demo/scripts/build-packs.sh

      - name: Build demo
        working-directory: demo
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
