# Publish-only facade crate.
#
# crates.io already has a third-party `lt` crate, so the engine cannot be
# published under its workspace package name (`lt`). This package re-exports
# the exact same engine source under the name `lingotweaker` while keeping the
# library name `lt`, so `cargo add lingotweaker` + `use lt::Engine` works for
# consumers. `src/` is a symlink to `../lt/src`; `cargo package` dereferences
# it and ships real files. The crate is excluded from the root workspace so
# workspace/CI builds do not compile the engine twice.
[workspace]

[package]
name = "lingotweaker"
version = "0.2.6"
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://github.com/fiduswriter/LingoTweaker"
homepage = "https://fiduswriter.github.io/LingoTweaker/"
readme = "../../README.md"
rust-version = "1.88"
description = "Proofreading engine: pattern rules, tagger, speller and pipelines for many languages"
keywords = ["proofreading", "grammar", "spellcheck", "nlp", "language"]
categories = ["text-processing", "internationalization"]

[lib]
name = "lt"

[dependencies]
lt-core = { path = "../lt-core", version = "0.2.6" }
lt-tokenize = { path = "../lt-tokenize", version = "0.2.6" }
lt-tagger = { path = "../lt-tagger", version = "0.2.6" }
lt-spell = { path = "../lt-spell", version = "0.2.6" }
lt-chunk = { path = "../lt-chunk", version = "0.2.6" }
lt-disambig = { path = "../lt-disambig", version = "0.2.6" }
lt-data = { path = "../lt-data", version = "0.2.6" }
lt-lindera = { path = "../lt-lindera", version = "0.2.6" }
lt-pattern = { path = "../lt-pattern", version = "0.2.6" }
regex = "1"
fancy-regex = "0.14"
aho-corasick = "1"
rustc-hash = "2"
unicode-normalization = "0.1"
# Detection: `lt` loads both bundled fastText models (lid.176.ftz and
# discriminator.ftz) through this crate. The facade compiles `lt`'s own source
# via a symlink, so it must declare every dependency that source uses — the
# version mirrors the workspace declaration in the root `Cargo.toml`, which this
# crate cannot inherit because it is excluded from the workspace.
fasttext-pure-rs = { version = "0.1", default-features = false }
