[workspace]
resolver = "2"
members = ["crates/*"]
# `crates/lingotweaker` is the publish-only facade crate. It shares the
# engine source with `crates/lt` through a symlink and is its own workspace,
# so workspace/CI builds do not compile the engine a second time.
# `vendor/lindera-dictionary` is a patched copy of the crates.io package (see
# tools/vendor/patch_lindera.py) pulled in through `[patch.crates-io]`; it is
# excluded from the workspace so its own tests/lints are not run.
exclude = ["crates/lingotweaker", "vendor/lindera-dictionary"]

# Lindera reads its compiled dictionary through `lt_data::fs` so a mounted
# in-memory data pack works on wasm. Regenerate the vendored copy with
# `python3 tools/vendor/patch_lindera.py`.
[patch.crates-io]
lindera-dictionary = { path = "vendor/lindera-dictionary" }

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://github.com/fiduswriter/LingoTweaker"
homepage = "https://fiduswriter.github.io/LingoTweaker/"
readme = "README.md"
rust-version = "1.88"

[workspace.dependencies]
# Path dependencies carry a version so the publishable crates can be pushed to
# crates.io (`cargo publish` strips the path and keeps the version). The
# non-publishable crates (`lt`, `lt-cli`, `lt-http`, `lt-py`, `lt-node`,
# `lt-wasm`) set `publish = false` in their own manifests; `lt` cannot be
# published because the crates.io name `lt` belongs to a third party.
lt = { path = "crates/lt", version = "0.1.1" }
lt-core = { path = "crates/lt-core", version = "0.1.1" }
lt-tokenize = { path = "crates/lt-tokenize", version = "0.1.1" }
lt-tagger = { path = "crates/lt-tagger", version = "0.1.1" }
lt-disambig = { path = "crates/lt-disambig", version = "0.1.1" }
lt-pattern = { path = "crates/lt-pattern", version = "0.1.1" }
lt-spell = { path = "crates/lt-spell", version = "0.1.1" }
lt-chunk = { path = "crates/lt-chunk", version = "0.1.1" }
lt-data = { path = "crates/lt-data", version = "0.1.1" }
lt-lindera = { path = "crates/lt-lindera", version = "0.1.1" }
lt-http = { path = "crates/lt-http", version = "0.1.1" }
lt-py = { path = "crates/lt-py", version = "0.1.1" }
lt-node = { path = "crates/lt-node", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
serde_json = "1"
thiserror = "2"
quick-xml = "0.37"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
regex = "1"
fancy-regex = "0.14"
aho-corasick = "1"
rustc-hash = "2"
unicode-normalization = "0.1"
axum = "0.8"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4", features = ["derive", "env"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Engine construction compiles thousands of rule regexes and the test suite
# builds an engine per test; optimized test binaries are several times faster
# at that than unoptimized ones (one-time compile cost, then fast iterations).
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
